name: Build Sept 15 TikToks

on:
  push:
    paths:
      - 'scripts/build_tomorrow_tiktoks.py'
      - '.github/workflows/build-sept15-tiktoks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-dejavu-core
          python3 -m pip install --break-system-packages pillow
      - name: Build and verify videos
        run: python3 scripts/build_tomorrow_tiktoks.py
      - name: Commit generated media
        run: |
          git config user.name 'Atlas Content Bot'
          git config user.email 'atlas-content-bot@users.noreply.github.com'
          git add tomorrow_media/*.mp4
          git commit -m 'Build Sept 15 TikTok videos at 30 FPS' || exit 0
          git push
